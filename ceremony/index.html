<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LODU — Final Results</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081126;color:#fff;font-family:Georgia,'Times New Roman',serif}body{display:grid;place-items:center}.world{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%,#9c572e55,transparent 45%),linear-gradient(180deg,#091b38 0%,#26395c 49%,#142842 75%,#061529 100%)}.world:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 54px,#ffffff06 55px 56px);opacity:.2}.harbor{position:absolute;bottom:0;left:0;right:0;height:19%;background:linear-gradient(#132a3e,#061120);clip-path:polygon(0 45%,5% 40%,5% 18%,6% 18%,6% 40%,13% 48%,13% 25%,14% 25%,14% 48%,20% 55%,28% 40%,28% 22%,29% 22%,29% 40%,39% 60%,50% 46%,60% 59%,70% 42%,70% 15%,71% 15%,71% 42%,79% 50%,85% 35%,85% 10%,86% 10%,86% 35%,95% 48%,100% 38%,100% 100%,0 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shell{position:relative;width:min(94vw,122vh);max-height:94vh;aspect-ratio:1.68;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1%;padding:2.3% 4%;background:linear-gradient(135deg,#d4a95a 0%,#51351a 2%,#101e33 5%,#0d1c31 95%,#54381c 98%,#f3c76a 100%);border:clamp(3px,.5vw,8px) ridge #dcb66a;border-radius:clamp(12px,2vw,28px);box-shadow:0 0 0 3px #261b14,0 24px 90px #000b,inset 0 0 45px #000a;overflow:hidden}.shell:before{content:'';position:absolute;inset:3%;border:1px solid #b88e4777;border-radius:14px;pointer-events:none}.logo{font:bold clamp(24px,4.5vw,70px) system-ui,sans-serif;letter-spacing:.02em;line-height:1;color:#ffdc7f;text-shadow:0 3px #65421b,0 7px 10px #000}.logo b:nth-child(1){color:#f35c4b}.logo b:nth-child(2){color:#fff}.logo b:nth-child(3){color:#60c67b}.logo b:nth-child(4){color:#5cb4ff}.tag{font:700 clamp(7px,.9vw,14px) system-ui,sans-serif;letter-spacing:.18em;color:#d4b57c}.title{font-weight:900;font-size:clamp(19px,3.7vw,58px);line-height:1.06;color:#ffe2a1;text-align:center;text-shadow:0 3px 1px #6a3916,0 5px 15px #000}.subtitle{font:700 clamp(9px,1.3vw,20px) system-ui,sans-serif;letter-spacing:.25em;color:#f4c96d}.results{width:100%;max-width:920px;display:flex;flex-direction:column;gap:clamp(5px,.75vh,12px);margin-top:1%;margin-bottom:1%}.entry{--accent:#d4aa62;display:grid;grid-template-columns:clamp(36px,5.2vw,80px) clamp(42px,5.6vw,82px) minmax(0,1fr) auto;align-items:center;gap:clamp(6px,1.1vw,18px);min-height:clamp(48px,9vh,100px);padding:clamp(4px,.6vw,9px) clamp(10px,1.5vw,24px);border:2px solid #a67a45;border-left:5px solid var(--accent);border-radius:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 19%,#111d33),#15233a 55%,#10192c);box-shadow:inset 0 1px #ffffff21,0 5px 14px #0008;opacity:0;transform:translateY(18px) scale(.98);transition:opacity .55s ease,transform .65s cubic-bezier(.2,1.25,.35,1)}.entry.show{opacity:1;transform:translateY(0) scale(1)}.entry:first-child{border-color:#eec96b;box-shadow:0 0 24px #f7c95755,inset 0 1px #fff5}.medal{width:clamp(33px,4.5vw,64px);height:clamp(33px,4.5vw,64px);display:grid;place-items:center;border-radius:50%;border:3px solid #f6d995;background:linear-gradient(130deg,#ffe49c,#99672b);color:#31200d;text-shadow:0 1px #fff6;font:bold clamp(19px,2.8vw,38px) Georgia,serif}.entry:nth-child(2) .medal{background:linear-gradient(135deg,#f3f6fa,#718299);border-color:#d7e4f2}.entry:nth-child(3) .medal{background:linear-gradient(135deg,#f8be82,#94532f);border-color:#e5a06a}.entry:nth-child(4) .medal{background:linear-gradient(135deg,#c4c4c4,#5e6570);border-color:#9fa4ae}.avatar{width:clamp(40px,5.4vw,78px);height:clamp(40px,5.4vw,78px);border-radius:50%;border:2px solid var(--accent);object-fit:cover;background:#2a3046;box-shadow:0 0 10px #000}.who{min-width:0}.player{font:bold clamp(15px,2.2vw,31px) Georgia,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff4d6}.faction{font:700 clamp(8px,1vw,15px) system-ui,sans-serif;color:#b7c6dd;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank{font:700 clamp(10px,1.2vw,18px) system-ui,sans-serif;color:#ffdb8d;text-align:right}.actions{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:1%}button{cursor:pointer;background:linear-gradient(#30a96b,#0b603d);color:#fff5d9;border:2px solid #e7c47b;border-radius:10px;padding:clamp(8px,1vw,16px) clamp(20px,3vw,48px);font:bold clamp(12px,1.4vw,21px) Georgia,serif;box-shadow:0 4px 0 #063923}button:focus-visible{outline:3px solid white}#mute{background:#20354e;padding:8px 12px;font:12px system-ui,sans-serif}.waiting{position:relative;color:#f8dfaa;text-align:center;font:20px Georgia,serif}.shell[hidden],.waiting[hidden]{display:none!important}@media(max-aspect-ratio:1/1){.shell{width:96vw;aspect-ratio:.9;max-height:92vh;padding:6% 4%}.results{gap:10px}.entry{grid-template-columns:35px 44px minmax(0,1fr);min-height:65px}.rank{display:none}.player{font-size:clamp(13px,3.5vw,23px)}.faction{font-size:9px}.title{font-size:clamp(24px,5.5vw,42px)}}@media(prefers-reduced-motion:reduce){.entry{transition:none}}

/* Stage 14 presentation-only repair: all ceremony content must remain visible. */
.world{background:linear-gradient(180deg,rgba(5,13,28,.18),rgba(6,16,33,.35)),url("assets/harbor_backdrop.jpg") center center / cover no-repeat;background-color:#10223a}
.world:before{display:none}
.harbor{display:none}
.shell{width:min(92vw,1100px);height:min(88vh,760px);max-height:none;aspect-ratio:auto;justify-content:space-between;gap:clamp(2px,.6vh,7px);padding:clamp(13px,2vh,22px) clamp(18px,3vw,40px);overflow:visible;flex-shrink:0}
.shell:before{inset:9px}
.logo{font-size:clamp(25px,min(4vw,5vh),54px);line-height:1.05;flex-shrink:0}
.tag{font-size:clamp(8px,1vw,12px);flex-shrink:0}
.title{font-size:clamp(25px,min(3.7vw,5.1vh),52px);line-height:1.02;flex-shrink:0}
.subtitle{font-size:clamp(10px,1.15vw,17px);flex-shrink:0}
.results{flex:1;min-height:0;margin:clamp(3px,.6vh,7px) 0;gap:clamp(4px,.8vh,9px);justify-content:center}
.entry{flex:1;min-height:0;max-height:105px;padding:clamp(3px,.5vh,7px) clamp(8px,1.3vw,18px)}
.medal{width:clamp(30px,min(4vw,7vh),58px);height:clamp(30px,min(4vw,7vh),58px)}
.avatar{width:clamp(35px,min(4.7vw,7.5vh),67px);height:clamp(35px,min(4.7vw,7.5vh),67px)}
.actions{flex-shrink:0;margin:0;min-height:43px}
.actions button{padding:clamp(7px,1vh,12px) clamp(14px,2vw,28px)}
@media(max-height:650px){.shell{height:94vh;padding:10px 25px}.logo{font-size:25px}.title{font-size:26px}.tag,.subtitle{font-size:9px}.entry{padding:2px 10px}.actions{min-height:34px}.actions button{padding:6px 14px}.medal{width:30px;height:30px;font-size:20px}.avatar{width:35px;height:35px}}
@media(max-aspect-ratio:1/1){.shell{width:96vw;height:min(92vh,850px);aspect-ratio:auto;padding:16px 13px}.entry{grid-template-columns:32px 38px minmax(0,1fr);gap:7px}.medal{width:30px;height:30px}.avatar{width:36px;height:36px}.rank{display:none}.player{font-size:clamp(13px,3.5vw,23px)}.faction{font-size:9px}.title{font-size:clamp(23px,5vw,38px)}.actions{gap:6px}.actions button{padding:8px 11px}}

/* LODU v6: translucent approved menu artwork behind the final standings.
   The PLAY button occupies the bottom of the source art, so only its upper
   71% is shown. All results and controls remain fully opaque above it. */
.shell::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;background:url("../assets/approved_home_mobile_9x16.png") top center / 100% 100% no-repeat;opacity:.35;clip-path:inset(0 0 29% 0);border-radius:inherit}
.shell > *{position:relative;z-index:1}
</style></head><body><div class="world"><div class="harbor"></div></div><canvas id="fireworks"></canvas><div id="waiting" class="waiting">Preparing match results…</div><main id="board" class="shell" hidden aria-label="LODU final standings"><div class="logo"><b>L</b><b>O</b><b>D</b><b>U</b></div><div class="tag">ESCORT. EXPLODE. WIN.</div><div class="title">VICTORY AT SEA!</div><div class="subtitle">FINAL STANDINGS</div><div id="results" class="results" aria-live="polite"></div><div class="actions"><button id="again">PLAY AGAIN ↻</button><button id="mute">🔊 Music on</button></div></main><audio id="music" src="assets/lodu_victory_fanfare.wav" preload="auto"></audio><script>
'use strict';
const allowed={Boris:{color:'#aa7bea',faction:'BEARISTAN'},Sterling:{color:'#75b9fa',faction:'AEGIONIA'},Long:{color:'#65df9d',faction:'DRAGONIA'},Zari:{color:'#f2a15b',faction:'RANGAPURA'}};
const $=id=>document.getElementById(id);let standings=null,timers=[],muted=false,started=false;
function clearSequence(){timers.forEach(clearTimeout);timers=[]}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function validate(rows){return Array.isArray(rows)&&rows.length>=2&&rows.length<=4&&rows.every((r,i)=>r&&r.rank===i+1&&Object.hasOwn(allowed,r.commander)&&typeof r.playerName==='string'&&typeof r.faction==='string'&&r.playerName.length<200)&&new Set(rows.map(r=>r.commander)).size===rows.length}
function makeRow(r){const el=document.createElement('div');el.className='entry';el.style.setProperty('--accent',allowed[r.commander].color);const medal=document.createElement('div');medal.className='medal';medal.textContent=r.rank;const avatar=document.createElement('img');avatar.className='avatar';avatar.alt=r.commander;avatar.src='assets/'+r.commander.toLowerCase()+'.png';const who=document.createElement('div');who.className='who';const player=document.createElement('div');player.className='player';player.textContent=r.playerName;const faction=document.createElement('div');faction.className='faction';faction.textContent=r.commander.toUpperCase()+' · '+r.faction.toUpperCase();who.append(player,faction);const rank=document.createElement('div');rank.className='rank';rank.textContent=r.rank===1?'🏆 CHAMPION':r.rank===2?'RUNNER-UP':r.rank===3?'3RD PLACE':'4TH PLACE';el.append(medal,avatar,who,rank);return el}
function play(){if(!standings)return;started=true;clearSequence();$('board').hidden=false;$('waiting').hidden=true;const holder=$('results');holder.replaceChildren();const rows=standings.map(makeRow);rows.forEach(row=>holder.append(row));if(!muted){const audio=$('music');audio.currentTime=0;audio.play().catch(()=>{ $('mute').textContent='▶ Enable music'; });}rows.slice().reverse().forEach((row,i)=>later(()=>{row.classList.add('show');if(i===rows.length-1)championBurst()},800+i*1300));startFireworks()}
function championBurst(){for(let i=0;i<5;i++)later(()=>burst(Math.random()*.7+.15,Math.random()*.35+.13,75),i*220)}
$('again').onclick=()=>parent.postMessage({type:'lodu-play-again'},'*');$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Music off':'🔊 Music on';if(muted){$('music').pause()}else{$('music').play().catch(()=>{})}};
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='lodu-final-results')return;if(!validate(event.data.standings)){console.error('Invalid final results rejected',event.data);return}standings=event.data.standings;play()});
// No default results. The ceremony is invisible until the parent game sends validated standings.
parent.postMessage({type:'lodu-results-ready'},'*');
const canvas=$('fireworks'),ctx=canvas.getContext('2d');let particles=[],fireworksActive=false,lastBurst=0;
function resize(){const ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*ratio);canvas.height=Math.round(innerHeight*ratio);ctx.setTransform(ratio,0,0,ratio,0,0)}addEventListener('resize',resize);resize();
function burst(x,y,n=55){const palette=['#f9d06e','#f29d5b','#8bbdff','#9ff1b4','#f39bdb'];const c=palette[Math.floor(Math.random()*palette.length)];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x:x*innerWidth,y:y*innerHeight,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+Math.random()*35,age:0,color:c})}}
function startFireworks(){if(fireworksActive)return;fireworksActive=true;requestAnimationFrame(draw)}
function draw(time){ctx.clearRect(0,0,innerWidth,innerHeight);if(time-lastBurst>900+Math.random()*500){burst(.06+Math.random()*.88,.08+Math.random()*.38,35+Math.floor(Math.random()*30));lastBurst=time}particles=particles.filter(p=>p.age++<p.life);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.028;p.vx*=.994;ctx.globalAlpha=Math.max(0,1-p.age/p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,1.2+1.4*(1-p.age/p.life),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;if(fireworksActive)requestAnimationFrame(draw)}
</script></body></html>
